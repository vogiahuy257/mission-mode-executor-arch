adaptive_mission_mode:
  ros__parameters:
    debug_output: true
    mode_name: "Adaptive Mission"
    px4_topic_namespace_prefix: ""
    persistence_file: ""

    mission:
      builtin_type: "none"            # none | takeoff_rtl | takeoff_hold_rtl | takeoff_waypoint_rtl
      auto_start: false
      start_policy:
        takeoff_if_landed: true
        takeoff_completion_timeout_sec: 45.0
      horizontal_velocity_m_s: 5.0
      vertical_velocity_m_s: 2.0
      max_heading_rate_rad_s: 1.0
      action_items:
        hold:
          id: "hold"
          duration_s: 5.0
        rtl:
          id: "rtl"
      waypoint:
        id: "waypoint"
        latitude_deg: 47.3977419
        longitude_deg: 8.5455939
        altitude_m: 10.0

    behavior_tree:
      tick_rate_hz: 20.0

    bt_lifecycle:
      run_preflight_checks: true
      start_stage_timeout_sec: 8.0

    manual_altitude_assist:
      enabled: true
      throttle_neutral: 0.5
      stick_deadzone: 0.15
      positive_throttle_only: true
      max_climb_rate_m_s: 0.5
      max_offset_m: 3.0

    status:
      publish_rate_hz: 5.0
